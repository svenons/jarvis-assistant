name: Build

# Build check: every pull request into master must compile before it can be merged.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

# A new push to the same PR supersedes the run in progress.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches Gradle state. On pull requests it only reads the cache, never writes it.
      - uses: gradle/actions/setup-gradle@v4

      # The Android SDK is preinstalled on ubuntu-latest (ANDROID_HOME); Gradle fetches any missing
      # platform/build-tools. app/build.gradle downloads and checksum-verifies the sherpa-onnx AAR.
      - name: Build
        run: ./gradlew :app:assembleDebug --stacktrace

      # No APK is uploaded on purpose: a ~150 MB artifact per push would eat storage quota if the
      # repo ever goes private, and the Release workflow publishes the real APK on merge.
      - name: Summary
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          echo "### Build OK" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$(basename "$apk")\` — $(du -h "$apk" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
